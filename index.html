<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Mob Randomizer</title>
    <style>
      body {
        background-color: #2c2f33;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding: 40px 20px;
        margin: 0;
      }
      h1 {
        color: #43b581;
        font-size: 2.5em;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.1em;
        color: #b9bbbe;
        margin-bottom: 30px;
      }
      #header-text {
        color: #ffffff;
        font-size: 1.8em;
        margin-bottom: 30px;
        text-transform: uppercase;
      }
      .container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
      }
      .card {
        background-color: #23272a;
        border: 2px solid #43b581;
        border-radius: 12px;
        width: 180px;
        min-height: 100px;
        padding: 20px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.4s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card h3 {
        margin: 0;
        font-size: 1.4em;
        color: #ffffff;
      }
      button {
        background-color: #43b581;
        color: white;
        border: none;
        padding: 15px 35px;
        font-size: 1.2em;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      button:hover {
        background-color: #3ca374;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        background-color: #72767d;
        cursor: not-allowed;
        transform: none;
      }

      /* Checklist Styles */
      .tracker-section {
        margin-top: 60px;
        border-top: 2px solid #43b581;
        padding-top: 30px;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
      }
      .tracker-section h2 {
        color: #43b581;
        margin-bottom: 20px;
      }
      .checklist-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        text-align: left;
        background-color: #23272a;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }
      .checklist-item {
        display: flex;
        align-items: center;
        font-size: 1.1em;
        color: #b9bbbe;
      }
      .checklist-item input[type="checkbox"] {
        margin-right: 10px;
        width: 18px;
        height: 18px;
        accent-color: #43b581;
      }
      .checked-text {
        text-decoration: line-through;
        color: #72767d;
      }
    </style>
  </head>
  <body>
    <h1>Minecraft Mob Randomizer</h1>
    <p>Click the button below to randomly select 5 Minecraft mobs!</p>

    <h2 id="header-text">WELCOME PLAYER TO MY MINECRAFT RANDOMIZER</h2>
    <button id="generate-btn" onclick="randomizeMobs()">Generate 5 Mobs</button>

    <div class="container" id="mob-container">
      <!-- Mobs will appear here -->
    </div>

    <div class="tracker-section">
      <h2>Mob Tracker</h2>
      <div class="checklist-container" id="checklist">
        <!-- Checkboxes will be generated here by JavaScript -->
      </div>
    </div>

    <script>
      const allMobs = [
        "Allay",
        "Armadillo",
        "Axolotl",
        "Bat",
        "Bee",
        "Blaze",
        "Bogged",
        "Breeze",
        "Camel",
        "Cat",
        "Cave Spider",
        "Chicken",
        "Cod",
        "Cow",
        "Creaking",
        "Creeper",
        "Donkey",
        "Drowned",
        "Enderman",
        "Endermite",
        "Evoker",
        "Fox",
        "Frog",
        "Goat",
        "Hoglin",
        "Horse",
        "Husk",
        "Iron Golem",
        "Llama",
        "Magma Cube",
        "Mooshroom",
        "Mule",
        "Ocelot",
        "Panda",
        "Parrot",
        "Phantom",
        "Pig",
        "Piglin",
        "Piglin Brute",
        "Pillager",
        "Polar Bear",
        "Pufferfish",
        "Rabbit",
        "Ravager",
        "Salmon",
        "Sheep",
        "Silverfish",
        "Skeleton",
        "Skeleton Horse",
        "Slime",
        "Sniffer",
        "Snow Golem",
        "Spider",
        "Squid",
        "Stray",
        "Strider",
        "Tadpole",
        "Trader Llama",
        "Tropical Fish",
        "Turtle",
        "Vex",
        "Villager",
        "Vindicator",
        "Wandering Trader",
        "Warden",
        "Witch",
        "Wither",
        "Wither Skeleton",
        "Zoglin",
        "Zombie",
        "Zombie Villager",
        "Zombified Piglin",
      ];

      let availableMobs = [...allMobs]; // Pool of mobs that haven't been picked yet
      let rollCount = 0;

      // Automatically build the checklist when the page loads
      window.onload = function () {
        const checklist = document.getElementById("checklist");

        allMobs.forEach((mob) => {
          const safeId = mob.replace(/\s+/g, "-"); // Replaces spaces with dashes for clean IDs
          const label = document.createElement("label");
          label.className = "checklist-item";
          label.id = `label-${safeId}`;

          // Checkboxes are disabled so the user can't manually uncheck them
          label.innerHTML = `
                    <input type="checkbox" id="chk-${safeId}" disabled> 
                    ${mob}
                `;
          checklist.appendChild(label);
        });
      };

      function randomizeMobs() {
        // Failsafe in case all mobs are used
        if (availableMobs.length === 0) return;

        rollCount++;
        const header = document.getElementById("header-text");
        header.innerText = `Times randomized: ${rollCount}`;

        const container = document.getElementById("mob-container");
        container.innerHTML = ""; // Clear previous cards

        // Shuffle the available mobs array
        let shuffled = [...availableMobs].sort(() => 0.5 - Math.random());

        // Pick up to 5 mobs (it will automatically pick fewer if less than 5 are left)
        let selectedMobs = shuffled.slice(0, 5);

        // Remove the newly selected mobs from the available pool
        availableMobs = availableMobs.filter(
          (mob) => !selectedMobs.includes(mob),
        );

        selectedMobs.forEach((mob) => {
          // 1. Create the Card
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `<h3>${mob}</h3>`;
          container.appendChild(card);

          // 2. Check off the box in the tracker
          const safeId = mob.replace(/\s+/g, "-");
          document.getElementById(`chk-${safeId}`).checked = true;
          document
            .getElementById(`label-${safeId}`)
            .classList.add("checked-text");
        });

        // Update button if we are officially out of mobs
        if (availableMobs.length === 0) {
          const btn = document.getElementById("generate-btn");
          btn.innerText = "All Mobs Generated!";
          btn.disabled = true;
        }
      }
    </script>
  </body>
</html>
