<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Mob Randomizer</title>
    <style>
      body {
        background-color: #2c2f33;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding: 40px 20px;
        margin: 0;
      }
      h1 {
        color: #43b581;
        font-size: 2.5em;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.1em;
        color: #b9bbbe;
        margin-bottom: 30px;
      }
      #header-text {
        color: #ffffff;
        font-size: 1.8em;
        margin-bottom: 30px;
        text-transform: uppercase;
      }
      .container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
      }
      .card {
        background-color: #23272a;
        border: 2px solid #43b581;
        border-radius: 12px;
        width: 180px;
        min-height: 100px;
        padding: 20px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.2s,
          border-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card:hover {
        transform: translateY(-5px);
        border-color: #55d498;
      }
      .card h3 {
        margin: 0;
        font-size: 1.4em;
        color: #ffffff;
      }
      button {
        background-color: #43b581;
        color: white;
        border: none;
        padding: 15px 35px;
        font-size: 1.2em;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      button:hover {
        background-color: #3ca374;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <h1>Minecraft Mob Randomizer</h1>
    <p>Click the button below to randomly select 5 Minecraft mobs!</p>

    <h2 id="header-text">WELCOME PLAYER TO MY MINECRAFT RANDOMIZER</h2>
    <button onclick="randomizeMobs()">Generate 5 Mobs</button>

    <div class="container" id="mob-container">
      <!-- Mobs will appear here -->
    </div>

    <script>
      const mobs = [
        "Allay",
        "Armadillo",
        "Axolotl",
        "Bat",
        "Bee",
        "Blaze",
        "Bogged",
        "Breeze",
        "Camel",
        "Cat",
        "Cave Spider",
        "Chicken",
        "Cod",
        "Cow",
        "Creaking",
        "Creeper",
        "Dolphin",
        "Donkey",
        "Drowned",
        "Elder Guardian",
        "Ender Dragon",
        "Enderman",
        "Endermite",
        "Evoker",
        "Fox",
        "Frog",
        "Ghast",
        "Glow Squid",
        "Goat",
        "Guardian",
        "Hoglin",
        "Horse",
        "Husk",
        "Iron Golem",
        "Llama",
        "Magma Cube",
        "Mooshroom",
        "Mule",
        "Ocelot",
        "Panda",
        "Parrot",
        "Phantom",
        "Pig",
        "Piglin",
        "Piglin Brute",
        "Pillager",
        "Polar Bear",
        "Pufferfish",
        "Rabbit",
        "Ravager",
        "Salmon",
        "Sheep",
        "Shulker",
        "Silverfish",
        "Skeleton",
        "Skeleton Horse",
        "Slime",
        "Sniffer",
        "Snow Golem",
        "Spider",
        "Squid",
        "Stray",
        "Strider",
        "Tadpole",
        "Trader Llama",
        "Tropical Fish",
        "Turtle",
        "Vex",
        "Villager",
        "Vindicator",
        "Wandering Trader",
        "Warden",
        "Witch",
        "Wither",
        "Wither Skeleton",
        "Wolf",
        "Zoglin",
        "Zombie",
        "Zombie Villager",
        "Zombified Piglin",
      ];

      let rollCount = 0; // Initialize our counter

      function randomizeMobs() {
        rollCount++; // Increase the counter by 1 each click

        // Change the welcome text to the counter
        const header = document.getElementById("header-text");
        header.innerText = `Times randomized: ${rollCount}`;

        const container = document.getElementById("mob-container");
        container.innerHTML = ""; // Clear previous results

        // Create a copy of the array and shuffle it to ensure no duplicates and no bias
        let shuffled = [...mobs].sort(() => 0.5 - Math.random());

        // Slice the first 5 mobs from our freshly randomized array
        let selectedMobs = shuffled.slice(0, 5);

        selectedMobs.forEach((mob) => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
                    <h3>${mob}</h3>
                `;

          container.appendChild(card);
        });
      }
    </script>
  </body>
</html>
